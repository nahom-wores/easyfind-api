name: Deploy to ECS

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: yisru-api
  ECS_CLUSTER: yisru-cluster
  ECS_SERVICE: yisru-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Gate: nothing deploys unless the tests pass.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test EasyFind.sln --configuration Release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::454252678518:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f EasyFind.Api/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # NOTE: this pipeline does NOT touch the database schema. Migrations are
      # applied by hand with `dotnet ef database update`, and that has to happen
      # BEFORE merging a change that needs one — otherwise the new tasks start
      # against the old schema and fail on first use.
      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      # Without this the workflow goes green the moment the API call returns,
      # while the new tasks may still be crash-looping behind it — on a schema
      # that was never migrated, most likely. ECS rolls back on its own; this
      # makes the deploy report that it did.
      - name: Wait for the deployment to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION